name: Publish Packages

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (auto, latest, next). Note: non-main only allows 'auto' or 'next'."
        required: false
        default: 'auto'
      promote_from_next:
        description: 'Promote already-published versions from next → latest'
        required: false
        default: 'false'
      dry_run:
        description: 'Run everything except npm publish'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Version, Build, Publish & Release
    runs-on: ubuntu-latest
    environment: npm-release
    env: {}

    steps:
      # ---------------- CHECKOUT ----------------
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # ---------------- NODE ----------------
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      # ---------------- DEBUG LOCKFILE ----------------
      - name: Debug lockfile hashes
        run: |
          git rev-parse HEAD
          sha256sum pnpm-lock.yaml rs-x-compiler/package.json

      # ---------------- INSTALL ----------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------- DIST TAG ----------------
      - name: Resolve dist-tag
        run: |
          DIST_TAG_INPUT='${{ github.event.inputs.dist_tag }}'
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            if [ -n "$DIST_TAG_INPUT" ] && [ "$DIST_TAG_INPUT" != "auto" ] && [ "$DIST_TAG_INPUT" != "next" ]; then
              echo "Error: dist-tag '$DIST_TAG_INPUT' is not allowed on non-main."
              exit 1
            fi
            DIST_TAG_INPUT="next"
          else
            if [ -z "$DIST_TAG_INPUT" ] || [ "$DIST_TAG_INPUT" = "auto" ]; then
              DIST_TAG_INPUT="latest"
            fi
          fi

          echo "DIST_TAG=$DIST_TAG_INPUT" >> "$GITHUB_ENV"
          echo "Resolved dist-tag: $DIST_TAG_INPUT"

      # ---------------- PRE-RELEASE MODE ----------------
      - name: Enter pre-release mode (next)
        if: ${{ env.DIST_TAG == 'next' }}
        run: pnpm changeset pre enter next

      - name: Exit pre-release mode
        if: ${{ env.DIST_TAG != 'next' }}
        run: pnpm changeset pre exit || true

      - name: Resolve next preVersion
        if: ${{ env.DIST_TAG == 'next' }}
        run: node scripts/resolve-next-preversion.mjs

      # ---------------- VERSION ----------------
      - name: Version packages (Changesets - latest)
        if: ${{ env.DIST_TAG != 'next' }}
        run: pnpm changeset version

      - name: Version packages (Changesets - next)
        if: ${{ env.DIST_TAG == 'next' }}
        run: |
          node scripts/resolve-next-preversion.mjs
          pnpm changeset version
          node scripts/bump-next-prerelease.mjs

      - name: Debug prerelease versions
        if: ${{ env.DIST_TAG == 'next' }}
        run: |
          echo "pre.json:"
          cat .changeset/pre.json
          node -e "console.log('@rs-x/core version:', require('./rs-x-core/package.json').version)"

      - name: Debug publish identity
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.event_name=${{ github.event_name }}"
          echo "github.actor=${{ github.actor }}"
          echo "github.workflow=${{ github.workflow }}"
          echo "github.workflow_ref=${{ github.workflow_ref }}"
          echo "github.repository=${{ github.repository }}"
          echo "github.repository_owner=${{ github.repository_owner }}"
          echo "job.environment=${{ job.environment.name || 'none' }}"

      - name: Debug npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          echo "registry=$(npm config get registry)"
          npm whoami
          npm view @rs-x/core version

      # ---------------- BUILD ----------------
      - name: Build Node libraries
        run: pnpm run build:libs

      - name: Build compiler
        run: pnpm run build:compiler

      - name: Build TypeScript plugin
        run: pnpm run build:ts-plugin

      - name: Build CLI
        run: pnpm --filter @rs-x/cli run build

      - name: Build Angular package
        run: pnpm run build:angular

      - name: Build React components
        run: pnpm --filter @rs-x/react-components run build

      - name: Package VS Code extension (VSIX)
        run: pnpm --filter rs-x-vscode-extension run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: rs-x-vscode-extension-vsix
          path: rs-x-vscode-extension/dist/rs-x-vscode-extension-*.vsix

      # ---------------- ROLLBACK GUARD ----------------
      - name: Abort if versions already exist on npm
        run: node scripts/check-npm-versions.mjs

      # ---------------- PRE-FLIGHT CHECK ----------------
      - name: Pre-check packages & Angular dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          echo "Checking npm for existing versions..."
          for pkg in @rs-x/core @rs-x/state-manager @rs-x/expression-parser @rs-x/compiler @rs-x/typescript-plugin @rs-x/cli @rs-x/react @rs-x/react-components @rs-x/vue; do
            if pnpm info $pkg &> /dev/null; then
              echo "$pkg exists on npm → will publish with OIDC & provenance"
            else
              echo "$pkg does not exist → NODE_AUTH_TOKEN required"
              if [ -z "$NODE_AUTH_TOKEN" ]; then
                echo "Error: NODE_AUTH_TOKEN missing for first-time publish"
                exit 1
              fi
            fi
          done

          if [ ! -d "rs-x-angular/dist/rsx" ]; then
            echo "Error: Angular dist folder not found → build failed"
            exit 1
          fi

      # ---------------- PUBLISH ----------------
      - name: Publish all packages (atomic)
        if: ${{ github.event.inputs.promote_from_next != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          DIST_TAG: ${{ env.DIST_TAG }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Only for first-time publishes
        run: |
          set -e
          node scripts/publish-packages.mjs

      # ---------------- COMMIT VERSION BUMP ----------------
      - name: Open PR for version bump
        if: success() && github.ref == 'refs/heads/main'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: release [ci skip]'
          branch: chore/release-version-bump
          delete-branch: true
          title: 'chore: release version bump'
          body: 'Automated version bump from publish workflow.'
          base: main

      - name: Auto-merge version bump PR
        if: success() && github.ref == 'refs/heads/main' && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --repo ${{ github.repository }}

      # ---------------- CREATE RELEASE ----------------
      - name: Create GitHub Release
        if: ${{ env.DIST_TAG == 'latest' && github.ref == 'refs/heads/main' }}
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: RS-X Release ${{ github.run_number }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
