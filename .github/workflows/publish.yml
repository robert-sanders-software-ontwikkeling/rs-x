name: Publish Packages

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (latest or next)'
        required: false
        default: 'latest'
      promote_from_next:
        description: 'Promote already-published versions from next → latest'
        required: false
        default: 'false'
      dry_run:
        description: 'Run everything except npm publish'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version, Build, Publish & Release
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      # ---------------- CHECKOUT ----------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ---------------- NODE ----------------
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      # ---------------- INSTALL ----------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------- VERSION ----------------
      - name: Version packages (Changesets)
        run: pnpm changeset version

      # ---------------- BUILD ----------------
      - name: Build Node libraries
        run: pnpm run build:libs

      - name: Build compiler
        run: pnpm run build:compiler

      - name: Build TypeScript plugin
        run: pnpm run build:ts-plugin

      - name: Build CLI
        run: pnpm --filter @rs-x/cli run build

      - name: Build Angular package
        run: pnpm run build:angular

      - name: Build React components
        run: pnpm --filter @rs-x/react-components run build

      - name: Package VS Code extension (VSIX)
        run: pnpm --filter rs-x-vscode-extension run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-x-vscode-extension-vsix
          path: rs-x-vscode-extension/rs-x-vscode-extension-*.vsix

      # ---------------- ROLLBACK GUARD ----------------
      - name: Abort if versions already exist on npm
        run: node scripts/check-npm-versions.mjs

      # ---------------- PRE-FLIGHT CHECK ----------------
      - name: Pre-check packages & Angular dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          echo "Checking npm for existing versions..."
          for pkg in @rs-x/core @rs-x/state-manager @rs-x/expression-parser @rs-x/compiler @rs-x/typescript-plugin @rs-x/cli @rs-x/react @rs-x/react-components; do
            if pnpm info $pkg &> /dev/null; then
              echo "$pkg exists on npm → will publish with OIDC & provenance"
            else
              echo "$pkg does not exist → NODE_AUTH_TOKEN required"
              if [ -z "$NODE_AUTH_TOKEN" ]; then
                echo "Error: NODE_AUTH_TOKEN missing for first-time publish"
                exit 1
              fi
            fi
          done

          if [ ! -d "rs-x-angular/dist/rsx" ]; then
            echo "Error: Angular dist folder not found → build failed"
            exit 1
          fi

      # ---------------- PUBLISH ----------------
      - name: Publish all packages (atomic)
        if: ${{ github.event.inputs.promote_from_next != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          DIST_TAG: ${{ github.event.inputs.dist_tag || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Only for first-time publishes
        run: |
          set -e
          node scripts/publish-packages.mjs

      # ---------------- COMMIT VERSION BUMP ----------------
      - name: Open PR for version bump
        if: success()
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: release [ci skip]'
          branch: chore/release-version-bump
          delete-branch: true
          title: 'chore: release version bump'
          body: 'Automated version bump from publish workflow.'
          base: main

      - name: Auto-merge version bump PR
        if: success() && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --repo ${{ github.repository }}

      # ---------------- CREATE RELEASE ----------------
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: RS-X Release ${{ github.run_number }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
