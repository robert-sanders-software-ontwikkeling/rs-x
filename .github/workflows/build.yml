name: Build & Test Monorepo

on:
  push:
    branches:
      - feature/**
      - fix/**
      - refactor/**
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # Checkout repository
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------
      # Setup pnpm
      # ------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      # ------------------------------
      # Setup Node.js (with pnpm cache)
      # ------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # ------------------------------
      # Debug lockfile + package.json
      # ------------------------------
      - name: Debug lockfile hashes
        run: |
          git rev-parse HEAD
          sha256sum pnpm-lock.yaml rs-x-compiler/package.json

      # ------------------------------
      # Install dependencies
      # ------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # =====================================================
      # 1️⃣ FORMAT
      # =====================================================
      - name: Check formatting
        run: pnpm -w run format:check

      # =====================================================
      # 2️⃣ LINT
      # =====================================================
      - name: Lint all projects
        run: pnpm -w run lint

      # =====================================================
      # 3️⃣ BUILD
      # =====================================================

      # Build all node libraries
      - name: Build Node libraries
        run: pnpm -w run build:libs

      # Build compiler package
      - name: Build compiler
        run: pnpm -w run build:compiler

      # Build TypeScript plugin
      - name: Build TypeScript plugin
        run: pnpm -w run build:ts-plugin

      # Build VS Code extension
      - name: Build VS Code extension
        run: pnpm -w run build:vscode-extension

      # Build CLI package
      - name: Build CLI
        run: pnpm --filter @rs-x/cli run build

      # Build expression editor
      - name: Build expression-editor
        run: pnpm -w run build:expression-editor

      # Build Angular library
      - name: Build Angular library
        run: pnpm -w run build:angular

      # Build React components library
      - name: Build React components
        run: pnpm --filter @rs-x/react-components run build

      # Build site (Next.js)
      - name: Build site
        run: pnpm --filter @rs-x/site run build

      # =====================================================
      # 4️⃣ TEST
      # =====================================================

      - name: Run Node tests
        run: pnpm -w run test

      - name: Run Angular tests
        run: pnpm -w run test:angular

      - name: Run React tests
        run: pnpm -w run test:react

      - name: Run Vue tests
        run: pnpm --filter @rs-x/vue run test

      # =====================================================
      # 5️⃣ ACCESSIBILITY
      # =====================================================

      - name: Install Playwright Chromium
        run: pnpm --filter @rs-x/site exec playwright install chromium --with-deps

      - name: Run axe accessibility tests
        run: pnpm --filter @rs-x/site run test:a11y

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a11y-report
          path: rs-x-site/a11y-report/
          retention-days: 14
