name: Build & Test Monorepo

on:
  push:
    branches:
      - feature/**
      - fix/**
      - refactor/**
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # Checkout repository
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------
      # Setup pnpm
      # ------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      # ------------------------------
      # Setup Node.js (with pnpm cache)
      # ------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # ------------------------------
      # Debug lockfile + package.json
      # ------------------------------
      - name: Debug lockfile hashes
        run: |
          git rev-parse HEAD
          sha256sum pnpm-lock.yaml rs-x-compiler/package.json

      # ------------------------------
      # Install dependencies
      # ------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # =====================================================
      # 1️⃣ FORMAT
      # =====================================================
      - name: Check formatting
        run: pnpm -w run format:check

      # =====================================================
      # 2️⃣ LINT
      # =====================================================
      - name: Lint all projects
        run: pnpm -w run lint

      # =====================================================
      # 3️⃣ BUILD
      # =====================================================

      # Build all node libraries
      - name: Build Node libraries
        run: pnpm -w run build:libs

      # Build compiler package
      - name: Build compiler
        run: pnpm -w run build:compiler

      # Build TypeScript plugin
      - name: Build TypeScript plugin
        run: pnpm -w run build:ts-plugin

      # Build VS Code extension
      - name: Build VS Code extension
        run: pnpm -w run build:vscode-extension

      # Build CLI package
      - name: Build CLI
        run: pnpm --filter @rs-x/cli run build

      # Build expression editor
      - name: Build expression-editor
        run: pnpm -w run build:expression-editor

      # Build Angular library
      - name: Build Angular library
        run: pnpm -w run build:angular

      # Build React components library
      - name: Build React components
        run: pnpm --filter @rs-x/react-components run build

      # Build site (Next.js)
      - name: Build site
        run: pnpm --filter @rs-x/site run build

      # =====================================================
      # 4️⃣ TEST
      # =====================================================

      - name: Run Node tests
        run: pnpm -w run test

      - name: Install VS Code for extension integration tests
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/keyrings/packages.microsoft.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y code xvfb

      - name: Run VS Code extension integration smoke test
        run: pnpm --filter rs-x-vscode-extension run test:host-smoke:ci

      - name: Run Angular tests
        run: pnpm -w run test:angular

      - name: Run React tests
        run: pnpm -w run test:react

      - name: Run Vue tests
        run: pnpm --filter @rs-x/vue run test

      # =====================================================
      # 5️⃣ ACCESSIBILITY
      # =====================================================

      - name: Install Playwright Chromium
        run: pnpm --filter @rs-x/site exec playwright install chromium --with-deps

      - name: Run axe accessibility tests
        run: pnpm --filter @rs-x/site run test:a11y

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a11y-report
          path: rs-x-site/a11y-report/
          retention-days: 14

  vscode-extension-windows-integration:
    name: VS Code extension integration (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VS Code extension and language services
        run: pnpm --filter rs-x-vscode-extension run vscode:prepublish

      - name: Install VS Code
        shell: pwsh
        run: |
          choco install vscode -y --no-progress
          "C:\Program Files\Microsoft VS Code\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check VS Code version
        run: code --version

      - name: Run VS Code extension integration smoke test
        run: pnpm --filter rs-x-vscode-extension run test:host-smoke:ci:windows
